<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Icebeing & The Very Questions</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="page-centered">
      <div class="container vstack text-center">
        <div class="hstack">
          <h1 class="artwork">
            <a href="/">
              <img src="/img/train.webp" id="train" width="800" height="450" alt="gif of the band" />
              <img
                src="/img/logo-overlay-2.png"
                id="train-overlay"
                width="2046"
                height="2046"
                alt="Icebeing & The Very Questions"
              />
            </a>
          </h1>
          <nav class="vstack ib" aria-label="Band links">
            <p>
              <a href="https://slinky.to/TheTrainWhatWasTheVerySingles" class="pink-1">listen</a>
            </p>
            <p>
              <a href="https://www.youtube.com/watch?v=r7m6bNv8Djk" class="orange-1">watch</a>
            </p>
            <p>
              <a href="/about" class="green-1" aria-label="?!?!?! — about Icebeing & The Very Questions">?!?!?!?!?!</a>
            </p>
            <p>
              <a href="https://www.instagram.com/theveryquestions" class="cyan-1">instagram</a>
            </p>
            <p>
              <a href="https://icebeing.bandcamp.com" class="yellow-1">bandcamp</a>
            </p>
            <p>
              <a href="https://icebeing.com" class="blue-1">Icebeing</a>
            </p>
          </nav>
        </div>
        <form
          action="https://icebeing.us8.list-manage.com/subscribe/post?u=acdd2bcb0f516e5068ab479fc&amp;id=b93eac4061&amp;f_id=001a94e0f0"
          method="post"
          class="signup vstack ib"
        >
          <h2>Sign up to the mailer!</h2>
          <div class="signup-field">
            <label for="mce-EMAIL">Email Address: </label>
            <input
              class="input"
              type="email"
              name="EMAIL"
              placeholder="..."
              id="mce-EMAIL"
              required
              autocomplete="email"
            />
          </div>
          <div class="honeypot" aria-hidden="true">
            <!-- Real people should not fill this in; keep this field to prevent bot signups. -->
            <input type="text" name="b_acdd2bcb0f516e5068ab479fc_b93eac4061" tabindex="-1" autocomplete="off" />
          </div>
          <div>
            <input type="submit" class="button" value="Sign up" />
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
